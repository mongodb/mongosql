[package]
name = "py-mongosqltranslate"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_mongosqltranslate"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
# Must match the bson major version used by `mongosql` and `agg-ast` (workspace
# `bson = "2"`); `Translation.pipeline` is a workspace `bson::Bson`.
bson = { workspace = true }
mongosql = { path = "../mongosql" }
agg-ast = { path = "../agg-ast/ast" }
