dataset:
  - db: "spec_query_join"
    collection:
      name: "bar"
      docs:
        - { "_id": 0, "foo": 1 }
        - { "_id": 1, "foo": 42 }
    schema:
      bsonType: "object"
      required: [ "foo" ]
      additionalProperties: false
      properties:
        _id:
          bsonType: "int"
        foo:
          bsonType: "int"

  - db: "spec_query_join"
    collection:
      name: "bar2"
      docs:
        - { "_id": 0, "foo": 42, "baz": 63 }
        - { "_id": 1, "foo": 43 }
    schema:
      bsonType: "object"
      required: [ "foo" ]
      additionalProperties: false
      properties:
        _id:
          bsonType: "int"
        foo:
          bsonType: "int"
        baz:
          bsonType: "int"

  - db: "spec_query_join"
    collection:
      name: "coll"
      docs:
        - { "_id": 0, "bar": 53, "car": 42 }
    schema:
      bsonType: "object"
      required: [ "bar", "car" ]
      additionalProperties: false
      properties:
        bar:
          bsonType: "int"
        car:
          bsonType: "int"

  - db: "spec_query_join_db2"
    collection:
      name: "foo"
      docs:
        - { "_id": 0, "x": 1 }
    schema:
      bsonType: "object"
      required: [ "x" ]
      additionalProperties: false
      properties:
        x:
          bsonType: "int"

  - db: "spec_query_join"
    collection:
      name: "parents"
      docs:
        - { "_id": 1, "nullable_field": 10, "non_nullable_field": 10 }
        - { "_id": 2, "nullable_field": null, "non_nullable_field": 10 }
    schema:
      bsonType: "object"
      required: [ "_id", "nullable_field", "non_nullable_field" ]
      additionalProperties: false
      properties:
        _id:
          bsonType: "int"
        nullable_field:
          anyOf:
            - bsonType: "int"
            - bsonType: !!str "null"
        non_nullable_field:
          bsonType: "int"

  - db: "spec_query_join"
    collection:
      name: "children"
      docs:
        - { "_id": 1, "nullable_field": 10, "non_nullable_field": 10 }
        - { "_id": 2, "nullable_field": null, "non_nullable_field": 10 }
    schema:
      bsonType: "object"
      required: [ "_id", "nullable_field", "non_nullable_field" ]
      additionalProperties: false
      properties:
        _id:
          bsonType: "int"
        nullable_field:
          anyOf:
            - bsonType: "int"
            - bsonType: !!str "null"
        non_nullable_field:
          bsonType: "int"
