tests:
  - name: "nothing to desugar"
    input:
      - { "$project": { "_id": 0, "expr": 1 } }
    expected:
      - { "$project": { "_id": 0, "expr": 1 } }

  - name: "desugar $sqlEq"
    input:
      - { "$project": { "_id": 0, "expr": { "$sqlEq": ["$a", "$b"] } } }
    expected:
      - {
        "$project":
          {
            "_id": 0,
            "expr":
              {
                "$let":
                  {
                    "vars":
                      {
                        "desugared_sqlEq_input0": "$a",
                        "desugared_sqlEq_input1": "$b",
                      },
                    "in":
                      {
                        "$cond":
                          [
                            "$or":
                              [
                                {
                                  "$lte":
                                    [
                                      "$$desugared_sqlEq_input0",
                                      { "$literal": null },
                                    ],
                                },
                                {
                                  "$lte":
                                    [
                                      "$$desugared_sqlEq_input1",
                                      { "$literal": null },
                                    ],
                                },
                              ],

                            { "$literal": null },

                            "$eq":
                              [
                                "$$desugared_sqlEq_input0",
                                "$$desugared_sqlEq_input1",
                              ],
                          ],
                      },
                  },
              },
          },
      }

